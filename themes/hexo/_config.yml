# @soul-blog/hexo — Hexo 主题配置
# 使用时请将本主题目录放入 Hexo 站点的 themes/ 目录，并在站点 _config.yml 中设置 theme: hexo

# 主题色
theme_color: '#EB4F38'

# 导航栏分类（对应 Hexo 站点的 categories，为空则自动生成）
categories:
  - frontend
  - duxcms
  - diary

# 页脚社交链接（与 @soul-blog/wc 的 SocialItem 结构一致）
social:
  - name: 微信
    icon: /images/extracted/home/iconfont-weixin@2x.png
    qr: /images/social/qr-weixin.svg
    hue: 74
    width: 22
    height: 18
  - name: QQ
    icon: /images/extracted/home/iconfont-QQ@2x.png
    qr: /images/social/qr-qq.svg
    hue: 178
    width: 17
    height: 18
  - name: GitHub
    icon: /images/social/github.svg
    url: https://github.com/
    mono: true
    hue: 0
    width: 21
    height: 18

# 页脚备案文案
icp: '@CallMeSoul 粤ICP备15053557'

# Logo 配置
logo:
  src: /images/extracted/login/图形@2x.png
  width: 60
  height: 55
  alt: CallMeSoul

# Giscus 评论（GitHub Discussions）
# 先在仓库启用 Discussions 并安装 Giscus App，再到 https://giscus.app/zh-CN
# 生成 repo_id / category_id；字段未填完整时，文章页会显示配置引导。
giscus:
  enabled: true
  repo: callmesoul/soul-blog-theme
  repo_id: R_kgDOUG1kRA
  category: Announcements
  category_id: ''
  term_prefix: 'article:'
  strict: true
  reactions_enabled: true
  input_position: top
  theme: dark_dimmed
  lang: zh-CN
  loading: lazy

# 关于我页面（D 款：个人宣言）
# 修改这里即可更新 /about/ 的全部展示内容。
about:
  enabled: true
  path: about
  page_title: 关于我
  kicker: About · Personal Manifesto
  title: 代码是工具，
  title_accent: 表达才是目的。
  description: 我喜欢把复杂的问题，做成简单、可靠、耐看的东西。这里记录我的技术实践、设计思考，以及值得被保存下来的生活切片。
  cards:
    - eyebrow: 01 · About
      title: |-
        我喜欢把复杂的问题，
        做成简单、可靠、耐看的东西。
      variant: wide
    - eyebrow: Currently
      title: |-
        Build.
        Write.
        Repeat.
      variant: accent
    - eyebrow: 02 · Believe
      text: 好产品应该安静地工作，不要求用户先理解它。
    - eyebrow: 03 · Explore
      text: |-
        Web / AI / Design
        Open Source / Life
    - eyebrow: 04 · Contact
      text: |-
        有好想法？
        hello@callmesoul.cn
      href: mailto:hello@callmesoul.cn

# 友链页面（人物画廊）
# 修改这里即可更新 /friends/；avatar 可省略，省略后显示 mark 或站名首字符。
friends:
  enabled: true
  path: friends
  page_title: 友链
  kicker: Friends · Curated People
  title: 一些值得
  title_accent: 反复拜访的人。
  description: 他们在各自的小世界里持续写作、创造，也让独立互联网保持温度。
  links:
    - name: 木木木木木
      url: https://immmmm.com
      domain: immmmm.com
      note: 有趣的灵魂，持续记录设计、技术与生活。
      mark: M
      color: '#ED5A42'
    - name: 保罗的小宇宙
      url: https://paugram.com
      domain: paugram.com
      note: 写代码，也写那些值得被好好记住的瞬间。
      mark: P
      color: '#CA8251'
    - name: 林木木
      url: https://imlinmu.com
      domain: imlinmu.com
      note: 热爱开源和摄影，相信长期主义的独立开发者。
      mark: L
      color: '#6D8580'
    - name: 青山
      url: https://qingshaner.com
      domain: qingshaner.com
      note: 在山野、胶片和文字之间，寻找缓慢的答案。
      mark: Q
      color: '#727A9A'
    - name: 旧梦与诗
      url: https://dreamer.ink
      domain: dreamer.ink
      note: 写诗，做产品，收集互联网仍然温柔的证据。
      mark: D
      color: '#A56C76'
    - name: 未读消息
      url: https://unread.one
      domain: unread.one
      note: 关于阅读、播客和偶尔抵达远方的信。
      mark: U
      color: '#8B7656'
