<!DOCTYPE html>
<html lang="zh-CN" class="h-full overflow-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1.0">
  <title>登录 - CallMeSoul</title>
  <link rel="stylesheet" href="./src/css/style.css">
  <link rel="preload" as="image" href="/images/extracted/login/081a7f1fa54d497bc3afcaa85c41528c@2x.png" fetchpriority="high">
  <script type="module" src="./src/js/main.js"></script>
  <style>
    /* 首帧关键 CSS：阻止模块加载前出现白屏/字体闪烁（其余样式均由 Tailwind 工具类提供） */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; background: #080808; color: #fff; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
  </style>
</head>
<body class="flex h-full w-full min-w-[1920px] items-center justify-center overflow-hidden bg-[#080808] font-sans text-[14px] leading-[1.6] tracking-[0.01em] text-white antialiased">
  <!-- 登录页复用公共背景，仅通过 image 属性切换背景资源。 -->
  <site-background image="/images/extracted/login/081a7f1fa54d497bc3afcaa85c41528c@2x.png"></site-background>
  <!-- 登录面板组件封装 Logo、输入区和登录操作，交互由 main.js 初始化。 -->
  <login-panel class="relative z-10 mb-10 flex flex-col items-center"></login-panel>
</body>
</html>
