<!DOCTYPE html>
<html lang="zh-CN" class="h-full overflow-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搜索 - CallMeSoul</title>
  <link rel="stylesheet" href="./src/css/style.css">
  <link rel="preload" as="image" href="/images/extracted/home/081a7f1fa54d497bc3afcaa85c41528c@2x.png" fetchpriority="high">
  <script type="module" src="./src/js/main.js"></script>
  <style>
    /* 首帧关键 CSS：防止模块加载前白屏闪烁；布局细节全部交给 Tailwind 工具类 */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #080808; color: #fff; scrollbar-width: thin; scrollbar-color: #444 transparent; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
  </style>
</head>
<body class="relative flex h-full min-h-screen flex-col overflow-hidden bg-[#080808] font-sans text-[14px] leading-[1.6] tracking-[0.01em] text-white antialiased">
  <!-- 公共背景组件复用首页背景层。 -->
  <site-background image="/images/extracted/home/081a7f1fa54d497bc3afcaa85c41528c@2x.png"></site-background>

  <!-- 搜索页主体：公共侧栏 + 搜索结果区。 -->
  <div class="relative z-10 flex min-h-0 flex-1 overflow-hidden">
    <site-sidebar></site-sidebar>
    <div class="relative flex min-w-0 flex-1 flex-col overflow-hidden">
      <search-results></search-results>
    </div>
  </div>

  <!-- 公共播放器组件跨页面保持播放状态。 -->
  <music-player></music-player>
</body>
</html>
