<!DOCTYPE html>
<html lang="zh-CN" class="h-full overflow-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CallMeSoul - 首页</title>
  <link rel="stylesheet" href="./src/css/style.css">
  <link rel="preload" as="image" href="/images/extracted/home/081a7f1fa54d497bc3afcaa85c41528c@2x.png" fetchpriority="high">
  <script type="module" src="./src/js/main.js"></script>
  <style>
    /* 首帧关键 CSS：防止模块加载前白屏闪烁；布局细节全部交给 Tailwind 工具类 */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #080808; color: #fff; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
  </style>
</head>
<body class="relative flex h-full min-h-screen flex-col overflow-hidden bg-[#080808] font-sans text-[14px] leading-[1.6] tracking-[0.01em] text-white antialiased">
  <!-- 公共背景组件：image 属性允许各页面复用同一套遮罩结构。 -->
  <site-background image="/images/extracted/home/081a7f1fa54d497bc3afcaa85c41528c@2x.png"></site-background>

  <!-- 首页主体由公共侧栏、文章阅读器和文章列表三个独立组件组合。 -->
  <div class="relative z-10 flex min-h-0 flex-1 overflow-hidden">
    <site-sidebar></site-sidebar>

    <div class="relative flex min-w-0 flex-1 flex-col overflow-hidden">
      <!-- 阅读器覆盖在列表上方，显隐状态由 main.js 的 hash 路由控制。 -->
      <article-viewer id="article-viewer" hidden aria-label="文章阅读器" role="region"></article-viewer>
      <article-list></article-list>
    </div>
  </div>

  <!-- 公共播放器组件独立于正文，跨目录切换时保持播放状态。 -->
  <music-player></music-player>

  <!-- 站内搜索弹出层（Ctrl+Shift+F）：模糊搜索文章/目录/正文。 -->
  <search-panel></search-panel>
</body>
</html>
